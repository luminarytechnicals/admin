  status = 301
  force = true

[[redirects]]
  from = "http://www.luminarytechnicals.dpdns.org/*"
  to = "https://luminarytechnicals.dpdns.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://luminarytechnicals.dpdns.org/*"
