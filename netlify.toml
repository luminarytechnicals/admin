# Netlify Configuration

# Redirect /index.html to preferred canonical root /
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Redirect all www and http variants to dpdns domain
[[redirects]]
  from = "https://www.luminarytechnicals.netlify.app/*"
  to = "https://luminarytechnicals.dpdns.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.luminarytechnicals.netlify.app/*"
  to = "https://luminarytechnicals.dpdns.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://luminarytechnicals.netlify.app/*"
  to = "https://luminarytechnicals.dpdns.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://luminarytechnicals.netlify.app/*"
  to = "https://luminarytechnicals.dpdns.org/:splat"
  status = 301
  force = true

# Catch old domain references
[[redirects]]
  from = "https://www.luminarytechnicals.com/*"
  to = "https://luminarytechnicals.dpdns.org/:splat"
