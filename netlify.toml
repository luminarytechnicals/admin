# Netlify Configuration

# Redirect all www and http variants to dpdns domain
[[redirects]]
  from = "https://www.luminarytechnicals.netlify.app/*"
  to = "https://luminarytechnicals.dpdns.org/:splat"
  status = 301
  force = true

