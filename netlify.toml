# Extensionless routes for root-level system pages.
[[redirects]]
  from = "/404.html"
  to = "/404"
  status = 301
  force = true

[[redirects]]
  from = "/403.html"
  to = "/403"
  status = 301
  force = true

[[redirects]]
  from = "/offline.html"
  to = "/offline"
  status = 301
  force = true

[[redirects]]
  from = "/404"
  to = "/404.html"
  status = 200
  force = true

[[redirects]]
  from = "/403"
  to = "/403.html"
  status = 200
  force = true

[[redirects]]
  from = "/offline"
  to = "/offline.html"
  status = 200
  force = true

# Clean URLs: redirect legacy .html addresses to extensionless canonical paths.
# Legacy News platform is now simply /frontend/updates.
[[redirects]]
  from = "/frontend/news.html"
  to = "/frontend/updates"
  status = 301
  force = true

[[redirects]]
  from = "/frontend/news"
  to = "/frontend/updates"
  status = 301
  force = true

[[redirects]]
  from = "/frontend/:page.html"
  to = "/frontend/:page"
  status = 301
  force = true

# Rewrite clean paths to the existing static HTML files without changing the address bar.
[[redirects]]
  from = "/frontend/:page"
  to = "/frontend/:page.html"
  status = 200
  force = true

# Global Security Headers & Asset Caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# CSS/JS are not fingerprinted, so they must revalidate on every visit (Netlify default).
# Only images and icons are cached (1 day).
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
