  force = true

[[redirects]]
  from = "http://www.luminarytechnicals.com/*"
  to = "https://luminarytechnicals.dpdns.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://luminarytechnicals.com/*"
  to = "https://luminarytechnicals.dpdns.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://luminarytechnicals.com/*"
  to = "https://luminarytechnicals.dpdns.org/:splat"
  status = 301
  force = true

# Redirect www dpdns variants to non-www
[[redirects]]
  from = "https://www.luminarytechnicals.dpdns.org/*"
