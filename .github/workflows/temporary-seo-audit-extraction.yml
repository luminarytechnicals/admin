name: Temporary SEO audit PDF extraction

on:
  pull_request:
    branches: [main]
    paths:
      - "SEO-AUDIT-luminarytechnicals.dpdns.org (2).pdf"
      - ".github/workflows/temporary-seo-audit-extraction.yml"
      - "tools/read_pdf.py"

permissions:
  contents: read

jobs:
  extract-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pymupdf
      - name: Extract text for audit review
        run: |
          python tools/read_pdf.py "SEO-AUDIT-luminarytechnicals.dpdns.org (2).pdf" | tee /tmp/seomator-audit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: seomator-audit-text
          path: /tmp/seomator-audit.txt
          retention-days: 1
